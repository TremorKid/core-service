server:
  port: ${core_port}
  web:
    allowed-origins: http://${ip_server}:${unity_service_port}/

application:
  rest:
    client:
      quiz-service: http://localhost:5000/

spring:
  datasource:
    url: jdbc:mysql://${host_db}:${port_db}/${database}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${user_db}
    password: ${pass_db}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

# swagger-ui
springdoc:
  swagger-ui.path: '/swagger-ui.html'
  api-docs:
    enabled: true
    path: /api-docs
  swagger-ui:
    enabled: true
    operations-sorter: none
  info:
    version: ${swagger_version}
  server:
    url: http://${ip_server}:${core_port}/

# Hibernate SQL Logging
logging:
  level:
    org.hibernate:
      sql: INFO
      type: INFO
    root: INFO